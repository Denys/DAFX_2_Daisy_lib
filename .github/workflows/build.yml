# DAFX-to-DaisySP CI/CD Pipeline
# Builds the maintained library and Pedal Harness acceptance target on multiple platforms.
# The broader legacy aggregate suite remains tracked separately until its API debt is repaired.

name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ ninja-build

    - name: Configure CMake
      run: >-
        cmake -S . -B ci-build -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_TESTING=ON
        -DBUILD_EXAMPLES=OFF

    - name: Build maintained targets
      run: >-
        cmake --build ci-build
        --target dafx_daisysp pedal_harness_tests fractional_delay_characterization
        --config Release

    - name: Run maintained tests
      run: >-
        ctest --test-dir ci-build -C Release
        -R "^(PedalHarnessContractTests|FractionalDelayCharacterization)$"
        --output-on-failure --verbose

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: >-
        cmake -S . -B ci-build
        -DBUILD_TESTING=ON
        -DBUILD_EXAMPLES=OFF

    - name: Build maintained targets
      run: >-
        cmake --build ci-build
        --target dafx_daisysp pedal_harness_tests fractional_delay_characterization
        --config Release

    - name: Run maintained tests
      run: >-
        ctest --test-dir ci-build -C Release
        -R "^(PedalHarnessContractTests|FractionalDelayCharacterization)$"
        --output-on-failure --verbose

  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: brew install cmake ninja

    - name: Configure CMake
      run: >-
        cmake -S . -B ci-build -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_TESTING=ON
        -DBUILD_EXAMPLES=OFF

    - name: Build maintained targets
      run: >-
        cmake --build ci-build
        --target dafx_daisysp pedal_harness_tests fractional_delay_characterization
        --config Release

    - name: Run maintained tests
      run: >-
        ctest --test-dir ci-build -C Release
        -R "^(PedalHarnessContractTests|FractionalDelayCharacterization)$"
        --output-on-failure --verbose

  legacy-regression:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ ninja-build

    - name: Configure full legacy aggregate
      run: cmake -S . -B legacy-build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build full legacy aggregate
      run: cmake --build legacy-build --config Release

    - name: Run full legacy tests
      run: ctest --test-dir legacy-build -C Release --output-on-failure --verbose

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check file formatting
      run: |
        # Check for trailing whitespace in C/C++ source and headers.
        ! grep -r --include="*.cpp" --include="*.h" --include="*.hpp" '[[:blank:]]$' src/ || echo "Warning: trailing whitespace found"

    - name: Check header guards
      run: |
        # Verify all headers have include guards.
        for f in $(find src \( -name "*.h" -o -name "*.hpp" \)); do
          if ! grep -q "#pragma once\|#ifndef" "$f"; then
            echo "Missing include guard: $f"
            exit 1
          fi
        done
