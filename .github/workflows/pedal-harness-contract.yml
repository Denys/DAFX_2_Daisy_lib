name: Pedal Harness Contract

on:
  pull_request:
    branches:
      - main
      - automation/delay-fractional-read-2026-08-01
      - automation/daisy-target-harness-2026-08-07
    paths:
      - "src/pedal_harness/**"
      - "tests/test_dsp_contract.cpp"
      - "tests/test_digital_delay_node.cpp"
      - "tests/test_fractional_delay_node.cpp"
      - "tests/test_delay_firmware_runtime.cpp"
      - "tests/delay_host_characterization.cpp"
      - "tests/CMakeLists.txt"
      - "examples/daisy_target_delay/**"
      - ".github/workflows/pedal-harness-contract.yml"
  workflow_dispatch:

jobs:
  contract-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure clean contract build
        run: >-
          cmake -S . -B phh-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DBUILD_EXAMPLES=OFF

      - name: Build portable harness target
        run: >-
          cmake --build phh-build
          --target pedal_harness_tests delay_host_characterization
          --config Release

      - name: Run portable harness tests
        run: >-
          ctest --test-dir phh-build -C Release
          -R "^PedalHarnessContractTests$"
          --output-on-failure --verbose

      - name: Capture host DIGI characterization
        run: |
          mkdir -p host-characterization
          ./phh-build/tests/delay_host_characterization \
            host-characterization/digi_h2_characterization.csv
          cat host-characterization/digi_h2_characterization.csv

      - name: Upload host characterization evidence
        uses: actions/upload-artifact@v4
        with:
          name: digi-host-h2-characterization
          path: host-characterization/digi_h2_characterization.csv
          if-no-files-found: error

  daisy-target-build:
    name: Daisy target build (${{ matrix.board }}, block ${{ matrix.block }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [POD, FIELD]
        block: [4, 16, 32, 48]

    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned libDaisy
        uses: actions/checkout@v4
        with:
          repository: electro-smith/libDaisy
          ref: 3bd68f206ef91c8052503f1e363b7e08438c44f5
          path: external/libDaisy
          submodules: recursive

      - name: Install ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make
          arm-none-eabi-g++ --version

      - name: Build pinned libDaisy
        run: make -C external/libDaisy -j2

      - name: Build profiled target harness
        run: |
          make -C examples/daisy_target_delay clean
          make -C examples/daisy_target_delay -j2 \
            BOARD=${{ matrix.board }} \
            AUDIO_BLOCK_SIZE=${{ matrix.block }} \
            ENABLE_PROFILING=1 \
            TIME_TRANSITION=DIRECT \
            LIBDAISY_DIR="$GITHUB_WORKSPACE/external/libDaisy"
          mkdir -p "target-artifacts/${{ matrix.board }}/block${{ matrix.block }}/profile"
          cp examples/daisy_target_delay/build/daisy_target_delay.elf \
             examples/daisy_target_delay/build/daisy_target_delay.bin \
             examples/daisy_target_delay/build/daisy_target_delay.map \
             "target-artifacts/${{ matrix.board }}/block${{ matrix.block }}/profile/"
          arm-none-eabi-size examples/daisy_target_delay/build/daisy_target_delay.elf \
            | tee "target-artifacts/${{ matrix.board }}/block${{ matrix.block }}/profile/size.txt"
          arm-none-eabi-size -A examples/daisy_target_delay/build/daisy_target_delay.elf \
            | tee "target-artifacts/${{ matrix.board }}/block${{ matrix.block }}/profile/sections.txt"

      - name: Build profiling-disabled target harness
        run: |
          make -C examples/daisy_target_delay clean
          make -C examples/daisy_target_delay -j2 \
            BOARD=${{ matrix.board }} \
            AUDIO_BLOCK_SIZE=${{ matrix.block }} \
            ENABLE_PROFILING=0 \
            TIME_TRANSITION=DIRECT \
            LIBDAISY_DIR="$GITHUB_WORKSPACE/external/libDaisy"
          mkdir -p "target-artifacts/${{ matrix.board }}/block${{ matrix.block }}/release"
          cp examples/daisy_target_delay/build/daisy_target_delay.elf \
             examples/daisy_target_delay/build/daisy_target_delay.bin \
             examples/daisy_target_delay/build/daisy_target_delay.map \
             "target-artifacts/${{ matrix.board }}/block${{ matrix.block }}/release/"
          arm-none-eabi-size examples/daisy_target_delay/build/daisy_target_delay.elf \
            | tee "target-artifacts/${{ matrix.board }}/block${{ matrix.block }}/release/size.txt"
          arm-none-eabi-size -A examples/daisy_target_delay/build/daisy_target_delay.elf \
            | tee "target-artifacts/${{ matrix.board }}/block${{ matrix.block }}/release/sections.txt"

      - name: Build Pod crossfade profiling candidate
        if: matrix.board == 'POD' && (matrix.block == 4 || matrix.block == 48)
        run: |
          make -C examples/daisy_target_delay clean
          make -C examples/daisy_target_delay -j2 \
            BOARD=POD \
            AUDIO_BLOCK_SIZE=${{ matrix.block }} \
            ENABLE_PROFILING=1 \
            TIME_TRANSITION=CROSSFADE \
            LIBDAISY_DIR="$GITHUB_WORKSPACE/external/libDaisy"
          mkdir -p "target-artifacts/POD/block${{ matrix.block }}/crossfade-profile"
          cp examples/daisy_target_delay/build/daisy_target_delay.elf \
             examples/daisy_target_delay/build/daisy_target_delay.bin \
             examples/daisy_target_delay/build/daisy_target_delay.map \
             "target-artifacts/POD/block${{ matrix.block }}/crossfade-profile/"
          arm-none-eabi-size examples/daisy_target_delay/build/daisy_target_delay.elf \
            | tee "target-artifacts/POD/block${{ matrix.block }}/crossfade-profile/size.txt"
          arm-none-eabi-size -A examples/daisy_target_delay/build/daisy_target_delay.elf \
            | tee "target-artifacts/POD/block${{ matrix.block }}/crossfade-profile/sections.txt"

      - name: Upload target build evidence
        uses: actions/upload-artifact@v4
        with:
          name: daisy-target-${{ matrix.board }}-block${{ matrix.block }}
          path: target-artifacts/${{ matrix.board }}/block${{ matrix.block }}
          if-no-files-found: error
