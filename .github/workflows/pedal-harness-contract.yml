name: Pedal Harness Contract

on:
  pull_request:
    branches: [ main ]
    paths:
      - "src/pedal_harness/**"
      - "tests/test_dsp_contract.cpp"
      - "tests/test_digital_delay_node.cpp"
      - "tests/test_fractional_delay.cpp"
      - "tests/fractional_delay_characterization.cpp"
      - "tests/validate_fractional_delay_csv.py"
      - "tests/CMakeLists.txt"
      - ".github/workflows/pedal-harness-contract.yml"
  workflow_dispatch:

jobs:
  contract-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure clean contract build
        run: >-
          cmake -S . -B phh-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DBUILD_EXAMPLES=OFF

      - name: Build portable harness targets
        run: >-
          cmake --build phh-build
          --target pedal_harness_tests fractional_delay_characterization
          --config Release

      - name: Run portable harness tests
        run: >-
          ctest --test-dir phh-build -C Release
          -R "^(PedalHarnessContractTests|FractionalDelayCharacterization)$"
          --output-on-failure --verbose

      - name: Capture fractional-read measurements
        run: >-
          ./phh-build/tests/fractional_delay_characterization
          > fractional-delay-characterization.csv

      - name: Validate characterization artifact
        run: >-
          python3 tests/validate_fractional_delay_csv.py
          fractional-delay-characterization.csv

      - name: Capture benchmark environment
        run: |
          {
            echo "compiler=$(c++ --version | head -n 1)"
            echo "compiler_flags=-O3 -DNDEBUG (CMake Release defaults)"
            echo "architecture=$(uname -m)"
            echo "os=$(uname -srmo)"
            echo "runner_image=${ImageOS:-unknown}"
            echo "build_type=Release"
            echo "commit=${GITHUB_SHA}"
          } > fractional-delay-characterization-metadata.txt

      - name: Upload characterization artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fractional-delay-characterization-linux
          path: |
            fractional-delay-characterization.csv
            fractional-delay-characterization-metadata.txt
